version: '3.8'
services:
  db:
    image: postgres:14.7
    environment:
      - POSTGRES_DB=nba_stats
      - POSTGRES_USER=nba_user
      - POSTGRES_PASSWORD=nba_password
    volumes:
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    ports:
      - "5432:5432"
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/nba_stats
      - SPRING_DATASOURCE_USERNAME=nba_user
      - SPRING_DATASOURCE_PASSWORD=nba_password
    depends_on:
      - db